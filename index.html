// ---------- API（書き込みガード付き） ----------
// ponytail: service_role を使うため技術的には何でも書けてしまう。
// このガードが唯一の保証線 — 許可する書き込みは下記の審査RPCと Storage の list(POST) だけ。
const REVIEW_RPCS = [
  'approve_identity_verification', 'reject_identity_verification', 'review_report', // serviceモード
  'admin_approve_identity_verification', 'admin_reject_identity_verification',      // adminモード（管理者ラッパ）
  'admin_review_report',
  // ペナルティ（20260718000006・service/admin両モード共通。処分メモ必須はDB側が強制）
  'admin_set_user_ban', 'admin_unban_user', 'admin_force_delete_user',
  // ブラウザPush通知の購読登録・解除（20260731000002・is_admin()がDB側で強制）
  'register_admin_push_subscription', 'unregister_admin_push_subscription',
  // person_id転記・重複フラグ審査（20260803000001・is_admin()がDB側で強制）
  'admin_register_person_keys', 'admin_review_duplicate_flag',
];
function assertAllowed(method, path) {
  const m = method.toUpperCase();
  if (m === 'GET' || m === 'HEAD') return;
  if (m === 'POST' && path.startsWith('/storage/v1/object/list/')) return; // 一覧取得のみ（副作用なし）
  if (m === 'POST' && REVIEW_RPCS.some(fn => path === '/rest/v1/rpc/' + fn)) return; // 審査の実行
  if (m === 'POST' && (path === '/auth/v1/token' || path.startsWith('/auth/v1/token?'))) return; // ログイン・トークン更新のみ
  if (m === 'POST' && path === '/auth/v1/logout') return; // 切断時のセッション失効
  throw new Error('書き込みガード: ' + m + ' ' + path + ' は許可されていません');
}
async function api(path, opts = {}) {
  const method = opts.method || 'GET';
  assertAllowed(method, path);
  const apikey = S.mode === 'admin' ? PUBLISHABLE_KEY : S.key;
  const headers = Object.assign({ apikey, Authorization: 'Bearer ' + S.key }, opts.headers || {});
  let body;
  if (opts.body !== undefined) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(opts.body); }
  const res = await fetch(S.url + path, { method, headers, body });
  // adminモード: アクセストークン失効(401)は一度だけ自動更新して再試行
  if (res.status === 401 && S.mode === 'admin' && S.refreshToken && !opts._retried) {
    if (await refreshSession()) return api(path, Object.assign({}, opts, { _retried: true }));
  }
  if (!res.ok) {
    let msg = 'HTTP ' + res.status;
    try { const j = await res.json(); msg += ' — ' + (j.message || j.msg || j.error_description || j.error || JSON.stringify(j)); } catch (e) { /* 本文なし */ }
    const err = new Error(msg);
    err.status = res.status;
    throw err;
  }
  return res;
}
const apiJson = async (path, opts) => (await api(path, opts)).json();
// 審査RPCの実行。エラー時はDBトリガーの RAISE メッセージがそのまま例外メッセージに載る
const callReviewRpc = (fn, args) => api('/rest/v1/rpc/' + fn, { method: 'POST', body: args });

// ---------- ブラウザPush通知（Web Push/VAPID。管理者ログインのみ対応） ----------
// Service WorkerはSecure Context（https または localhost）でのみ登録できる。
// file:// で開いた場合や service モード（service_roleキー直接接続）では未対応。
function urlBase64ToUint8Array(base64) {
  const padding = '='.repeat((4 - (base64.length % 4)) % 4);
  const base64safe = (base64 + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64safe);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
async function getPushSubscription() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return null;
  // 引数なし = 現在のページURLに一致するスコープの登録を返す
  // （このページでは admin-push-sw.js 以外のService Workerを使わない前提）
  const reg = await navigator.serviceWorker.getRegistration();
  if (!reg) return null;
  return reg.pushManager.getSubscription();
}
// ログイン成功時・セッション復元時に1度呼び、現在の購読状態をS.pushへ反映する
async function refreshPushUiState() {
  try {
    const sub = await getPushSubscription();
    S.push.subscribed = !!sub;
  } catch (e) {
    S.push.subscribed = false;
  }
}
async function enablePushNotifications() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    toast('このブラウザはプッシュ通知に対応していません'); return;
  }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { toast('通知が許可されませんでした'); return; }
  const reg = await navigator.serviceWorker.register('./admin-push-sw.js');
  const sub = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlBase64ToUint8Array(PUSH_VAPID_PUBLIC_KEY),
  });
  const j = sub.toJSON();
  await callReviewRpc('register_admin_push_subscription', {
    p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth,
  });
  S.push.subscribed = true;
  toast('プッシュ通知を有効にしました');
  render();
}
async function disablePushNotifications() {
  const sub = await getPushSubscription();
  if (sub) {
    await callReviewRpc('unregister_admin_push_subscription', { p_endpoint: sub.endpoint });
    await sub.unsubscribe();
  }
  S.push.subscribed = false;
  toast('プッシュ通知を無効にしました');
  render();
}

// 読み取りRPC（stable）のGET用クエリ文字列
function rpcQuery(params) {
  return Object.entries(params)
    .filter(([, v]) => v !== null && v !== undefined && v !== '')
    .map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
}
// adminモードのトークン更新（失敗したらログイン画面へ戻す）
async function refreshSession() {
  try {
    const res = await fetch(S.url + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { apikey: PUBLISHABLE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: S.refreshToken }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    S.key = j.access_token;
    S.refreshToken = j.refresh_token || S.refreshToken;
    persistSession();
    return true;
  } catch (e) {
    disconnect();
    toast('セッションの有効期限が切れました。再ログインしてください', true);
    return false;
  }
}
function persistSession() {
  if (!S.persist) return;
  // service_role キー（RLSを全バイパスする全権キー）は sessionStorage に保存しない。
  // 永続化は、権限が審査のみに限定され漏えい時もパスワード変更で即失効できる
  // 管理者ログイン（admin: access/refresh トークン）にのみ許可する。
  if (S.mode !== 'admin') return;
  sessionStorage.setItem(SS_KEY, JSON.stringify({ url: S.url, mode: S.mode, key: S.key, refreshToken: S.refreshToken }));
}

function encodePath(p) { return p.split('/').map(encodeURIComponent).join('/'); }

const blobCache = new Map(); // path -> objectURL（タブ生存中のみ・ディスクに保存しない）
async function fetchObjectUrl(bucket, path) {
  const k = bucket + '/' + path;
  if (blobCache.has(k)) return blobCache.get(k);
  const res = await api('/storage/v1/object/authenticated/' + bucket + '/' + encodePath(path));
  const u = URL.createObjectURL(await res.blob());
  blobCache.set(k, u);
  return u;
}

// Content-Range: "0-24/123" または "*/0" から総件数を得る
function totalFromRange(res) {
  const cr = res.headers.get('content-range');
  if (!cr || !cr.includes('/')) return NaN;
  return parseInt(cr.split('/')[1], 10);
}
async function countRows(table, query) {
  const res = await api('/rest/v1/' + table + '?select=id&limit=1' + (query ? '&' + query : ''),
    { headers: { Prefer: 'count=exact' } });
  return totalFromRange(res);
}

// ---------- ユーティリティ ----------
function el(tag, attrs, ...children) {
  const n = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined) continue;
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of children.flat(9)) {
    if (c === null || c === undefined || c === false) continue;
    n.append(c instanceof Node ? c : String(c));
  }
  return n;
}
const fmtDT = new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
const jst = ts => ts ? fmtDT.format(new Date(ts)) : '—';
function jstToday() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo' }).format(new Date()); }
function calcAge(birth, today) {
  const [by, bm, bd] = birth.split('-').map(Number);
  const [ty, tm, td] = today.split('-').map(Number);
  let a = ty - by;
  if (tm < bm || (tm === bm && td < bd)) a--;
  return a;
}
// 滞留日数の算出（JST暦日基準）。created_at は timestamptz のためまずJSTの暦日に丸めてから差分を取る
// （UTC基準で単純に引くと日またぎの時刻でずれるため）
function jstDateOnly(isoTs) { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo' }).format(new Date(isoTs)); }
function daysBetweenDates(fromDateStr, toDateStr) {
  return Math.round((new Date(toDateStr + 'T00:00:00Z') - new Date(fromDateStr + 'T00:00:00Z')) / 86400000);
}
function daysPending(createdAt, today) { return daysBetweenDates(jstDateOnly(createdAt), today); }
const STALE_WARN_DAYS = 3; // これ以上経過した審査待ちは黄色バッジ
const STALE_BAD_DAYS = 7;  // これ以上経過した審査待ちは赤バッジ

function looksLikeMyNumber(s) {

function jwtRole(key) {
  try { return JSON.parse(atob(key.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).role || null; }
  catch (e) { return null; } // 新形式キー(sb_secret_...)はJWTではない
}
async function connect(url, key, save) {
  S.url = url.replace(/\/+$/, '');
  S.key = key.trim();
  S.mode = 'service';
  S.refreshToken = '';
  S.persist = save;
  try {
    await api('/auth/v1/admin/users?page=1&per_page=1'); // service_role でないと 401/403
  } catch (e) {
    const role = jwtRole(S.key);
    S.url = ''; S.key = ''; // 検証に通るまで接続状態にしない（失敗時は接続フォームに留まる）
    if (role && role !== 'service_role') e.message += '（このキーの role は ' + role + ' です。service_role キーが必要）';
    throw e;
  }
  persistSession();
  updateConnUI();
  render();
}
async function loginAdmin(url, email, password, save) {
  S.url = url.replace(/\/+$/, '');
  S.mode = 'admin';
  S.persist = save;
  try {
    const j = await apiJson('/auth/v1/token?grant_type=password', {
      method: 'POST', body: { email, password },
      headers: { Authorization: 'Bearer ' + PUBLISHABLE_KEY },
    });
    S.key = j.access_token;
    S.refreshToken = j.refresh_token || '';
    // 管理者登録の確認（admin_users 未登録なら ADMIN: エラーで弾かれる）
    await apiJson('/rest/v1/rpc/admin_count_identity_verifications');
  } catch (e) {
    S.url = ''; S.key = ''; S.refreshToken = ''; S.mode = 'service';
    throw e;
  }

  persistSession();
  await refreshPushUiState();
  updateConnUI();
  render();
}
function disconnect() {
  // adminモードはサーバー側のセッションも失効させる（fire-and-forget・失敗しても切断は続行）
  if (S.mode === 'admin' && S.key) {
    fetch(S.url + '/auth/v1/logout', {
      method: 'POST',
      headers: { apikey: PUBLISHABLE_KEY, Authorization: 'Bearer ' + S.key },
    }).catch(() => {});
  }
  sessionStorage.removeItem(SS_KEY);
  S.url = ''; S.key = ''; S.refreshToken = ''; S.mode = 'service'; S.persist = false; S.swagger = null;
  for (const u of blobCache.values()) URL.revokeObjectURL(u);
  blobCache.clear();
  updateConnUI();

}

// 一覧＋件数の取得。serviceモードは PostgREST 直、adminモードは管理者RPC（GET）経由
async function fetchReviewPage() {
  const r = S.review;
  const stFilter = r.status === 'all' ? null : r.status;
  if (S.mode === 'admin') {
    const uid = r.userFilter || null;
    const cnt = st => apiJson('/rest/v1/rpc/admin_count_identity_verifications?' + rpcQuery({ p_status: st, p_user_id: uid }));
    const [pend, appr, rej, rows] = await Promise.all([
      cnt('pending'), cnt('approved'), cnt('rejected'),
      apiJson('/rest/v1/rpc/admin_list_identity_verifications?' +
        rpcQuery({ p_status: stFilter, p_user_id: uid, p_limit: r.limit, p_offset: r.offset })),
    ]);
    const counts = [pend, appr, rej];
    const total = stFilter ? counts[['pending', 'approved', 'rejected'].indexOf(stFilter)] : pend + appr + rej;
    return { counts, rows, total };
  }
  const uf = r.userFilter ? '&user_id=eq.' + encodeURIComponent(r.userFilter) : '';
  const [counts, rowsRes] = await Promise.all([
    Promise.all(['pending', 'approved', 'rejected'].map(st => countRows('identity_verifications', 'status=eq.' + st + uf))),
    api('/rest/v1/identity_verifications?select=*&order=created_at.asc,id.asc&limit=' + r.limit +
      '&offset=' + r.offset + (stFilter ? '&status=eq.' + stFilter : '') + uf,
      { headers: { Prefer: 'count=exact' } }),
  ]);
  return { counts, rows: await rowsRes.json(), total: totalFromRange(rowsRes) };
}

// 保留内訳（書類種別ごとの件数・滞留日数）の集計。選択中のステータスフィルタに関わらず
// 常に「審査待ち」を対象にする（運用上いちばん見たい情報のため）。上限件数で打ち切り、
// 超過時はその旨を表示する（黙って一部だけ集計して「全体」のように見せない）
const PENDING_BREAKDOWN_CAP = 500;
async function fetchPendingBreakdown() {
  const uid = S.review.userFilter || null;
  let items;
  if (S.mode === 'admin') {
    items = await apiJson('/rest/v1/rpc/admin_list_identity_verifications?' +
      rpcQuery({ p_status: 'pending', p_user_id: uid, p_limit: PENDING_BREAKDOWN_CAP, p_offset: 0 }));
  } else {
    const uf = uid ? '&user_id=eq.' + encodeURIComponent(uid) : '';
    items = await apiJson('/rest/v1/identity_verifications?select=document_type,created_at&status=eq.pending&limit=' + PENDING_BREAKDOWN_CAP + uf);
  }
  const today = jstToday();
  const byType = new Map();
  let stale = 0;
  for (const it of items) {
    byType.set(it.document_type, (byType.get(it.document_type) || 0) + 1);
    if (daysPending(it.created_at, today) >= STALE_WARN_DAYS) stale++;
  }
  return { byType, stale, truncated: items.length >= PENDING_BREAKDOWN_CAP };
}

  const root = el('div');
  root.append(el('div', { class: 'callout' },
    el('b', null, 'マイナンバー裏面（個人番号）が写っていた場合: '),
    '審査より先に Studio → Storage で該当オブジェクトを即削除（保管自体が違法・番号法20条）。このビューアからは削除できません。個人番号・氏名・住所を却下理由やメモに絶対に転記しないこと。'));
  root.append(memberIdSearchBar());

  const chips = el('div', { class: 'toolbar' });
  const breakdown = el('div', { class: 'toolbar', style: 'font-size:12px' });
  const listBox = el('div', { class: 'card' }, el('div', { class: 'placeholder' }, '読込中…'));
  const pager = el('div', { class: 'pager' });
  root.append(chips, breakdown, listBox, pager);

  // 保留内訳は一覧の読み込みとは独立させる（この集計だけ失敗しても一覧表示は妨げない）
  (async () => {
    try {
      const { byType, stale, truncated } = await fetchPendingBreakdown();
      if (!alive(root)) return;
      breakdown.textContent = '';
      if (!byType.size) return;
      breakdown.append(el('span', { class: 'dim' }, '審査待ちの内訳: '));
      for (const [type, n] of [...byType.entries()].sort((a, b) => b[1] - a[1])) {
        breakdown.append(el('span', { class: 'badge grey' }, (DOC_TYPES[type] || type) + ' ' + n));
      }
      if (stale > 0) {
        breakdown.append(el('span', {
          class: 'badge warn',
          title: '申請から' + STALE_WARN_DAYS + '日以上経過した審査待ち（各行にも同様のバッジを表示）',
        }, STALE_WARN_DAYS + '日以上滞留 ' + stale));
      }
      if (truncated) {
        breakdown.append(el('span', { class: 'dim' }, '（先頭' + PENDING_BREAKDOWN_CAP + '件のみ集計）'));
      }
    } catch (e) {
      if (alive(root)) breakdown.textContent = '';
    }
  })();

  (async () => {
    try {
      const { counts, rows, total } = await fetchReviewPage();
      if (!alive(root)) return;
      // 他所の審査でキューが縮んで offset が総件数を超えたら最終ページへ戻す
      if (!rows.length && total > 0 && S.review.offset > 0) {
        S.review.offset = Math.floor((total - 1) / S.review.limit) * S.review.limit;
        render();
        return;
      }
      const all = counts[0] + counts[1] + counts[2];

      // ステータスチップ
      chips.textContent = '';
      const defs = [['pending', counts[0]], ['approved', counts[1]], ['rejected', counts[2]], ['all', all]];
      for (const [st, n] of defs) {
        chips.append(el('button', {
          class: 'chip' + (S.review.status === st ? ' active' : ''),
          onclick: () => { S.review.status = st; S.review.offset = 0; S.review.openId = null; render(); },
        }, (st === 'all' ? 'すべて' : STATUS_LABEL[st]) + ' ' + n));
      }
      if (S.review.userFilter) {
        chips.append(el('span', { class: 'badge grey mono' }, '利用者: ' + S.review.userFilter.slice(0, 8) + '…'),
          el('button', { class: 'btn', onclick: () => { S.review.userFilter = ''; S.review.offset = 0; render(); } }, '絞り込み解除'));
      }
      chips.append(el('button', { class: 'btn', style: 'margin-left:auto', onclick: () => render() }, '再読込'));

      // 一覧
      listBox.textContent = '';
      if (!rows.length) listBox.append(el('div', { class: 'placeholder' }, '該当する申請はありません'));
      for (const row of rows) listBox.append(buildReviewRow(row));

      // ページャ
      pager.textContent = '';
      const from = total ? S.review.offset + 1 : 0;
      const to = S.review.offset + rows.length;
      pager.append(
        el('button', { class: 'btn', disabled: S.review.offset === 0 ? '' : null, onclick: () => { S.review.offset = Math.max(0, S.review.offset - S.review.limit); render(); } }, '前へ'),
        el('span', null, from + '–' + to + ' / ' + total + ' 件（申請日時の古い順）'),
        el('button', { class: 'btn', disabled: to >= total ? '' : null, onclick: () => { S.review.offset += S.review.limit; render(); } }, '次へ'));
    } catch (e) {
      if (alive(root)) { listBox.textContent = ''; listBox.append(el('div', { class: 'placeholder' }, '読込失敗: ' + e.message)); }
    }
  })();
  return root;
}

// 審査待ちの滞留バッジ（申請から STALE_WARN_DAYS / STALE_BAD_DAYS 日以上）。承認・却下済みの行には出さない
function staleBadge(row) {
  if (row.status !== 'pending') return null;
  const days = daysPending(row.created_at, jstToday());
  if (days < STALE_WARN_DAYS) return null;
  const cls = days >= STALE_BAD_DAYS ? 'bad' : 'warn';
  return el('span', { class: 'badge ' + cls, title: '申請から' + days + '日経過（滞留の目安: ' + STALE_WARN_DAYS + '日）' }, days + '日経過');
}

function buildReviewRow(row) {
  const card = el('div', { class: 'card' });
  const head = el('div', { class: 'rowcard' },
    statusBadge(row.status),
    el('span', null, DOC_TYPES[row.document_type] || row.document_type),
    el('span', { class: 'dim' }, '申請 ' + jst(row.created_at)),
    el('span', { class: 'dim' }, '利用者 ', idSpan(row.user_id)),
    scoreBadge(row.face_match_score),
    staleBadge(row),
    row.selfie_path ? null : el('span', { class: 'badge warn', title: '2026-07-10以前の旧申請' }, '自撮りなし'),
    row.gender_on_document ? el('span', { class: 'badge grey' }, '転記: ' + (GENDER_LABEL[row.gender_on_document] || row.gender_on_document)) : null,
  );
  head.addEventListener('click', () => {
    const open = card.querySelector('.detail');
    if (open) { open.remove(); S.review.openId = null; }
    else { S.review.openId = row.id; card.append(buildReviewDetail(row)); }
  });
  card.append(head);
  if (S.review.openId === row.id) card.append(buildReviewDetail(row));
  return card;
}

function imageBox(label, path, missingNote) {
  const box = el('div', { class: 'imgbox' }, el('div', { class: 'imglabel' }, label));
  if (!path) { box.append(el('div', { class: 'imgholder' }, missingNote || 'パスなし')); return box; }
  box.append(el('div', { class: 'imgpath mono trunc', title: 'クリックでパスをコピー', onclick: () => copyText(path) }, path));
  const holder = el('div', { class: 'imgholder' }, '読込中…');
  box.append(holder);
  fetchObjectUrl(DOC_BUCKET, path).then(u => {
    if (!alive(holder)) return;
    holder.textContent = '';
    holder.append(el('img', { src: u, alt: label, onclick: () => openLightbox(u, label + ' — ' + path) }));
  }).catch(e => {
    if (!alive(holder)) return;
    holder.classList.add('err');
    holder.textContent = e.status === 404 || e.status === 400
      ? '画像が見つかりません（クリーンアップ削除済み・または未アップロード）'
      : '取得失敗: ' + e.message;
  });
  return box;
}

function videoBox(label, path, missingNote) {
  const box = el('div', { class: 'imgbox' }, el('div', { class: 'imglabel' }, label));

}

function buildReviewDetail(row) {
  const d = el('div', { class: 'detail', onclick: e => e.stopPropagation() });

  // 左: 画像（書類と自撮りを並べて目視照合）+ ライブネス動画（証跡）
  const left = el('div', null,
    el('div', { class: 'imgs' },
      imageBox('書類画像（生年月日・性別欄・有効期限を確認）', row.document_path),
      imageBox('自撮り画像（書類の顔写真と見比べる）', row.selfie_path, '自撮りなし（2026-07-10以前の旧申請のため対象外）'),
      videoBox('本人確認動画（ライブネス判定セッション・証跡）', row.video_path, '動画なし（2026-07-16以前の旧申請のため対象外）')));

  // path先頭フォルダ ≠ user_id の防御チェック（DB制約済みだが不一致は即通報扱いのため表示）
  for (const p of [row.document_path, row.selfie_path]) {
    if (p && p.split('/')[0] !== row.user_id) {
      left.append(el('div', { class: 'callout' }, 'パスの先頭フォルダが user_id と一致しません。即通報扱いの異常データです: ' + p));
    }
  }

  // 右: 転記事実・利用者情報
  const today = jstToday();
  const facts = el('dl', { class: 'facts' },
    el('dt', null, '申請ID'), el('dd', null, idSpan(row.id)),
    el('dt', null, '利用者ID'), el('dd', null, idSpan(row.user_id), ' ',
      el('button', { class: 'btn', style: 'padding:1px 8px;font-size:12px', onclick: () => { S.review.userFilter = row.user_id; S.review.offset = 0; S.review.status = 'all'; render(); } }, 'この利用者の全申請')),
    el('dt', null, '書類種別'), el('dd', null, (DOC_TYPES[row.document_type] || row.document_type) + ' (' + row.document_type + ')'),
    el('dt', null, 'ステータス'), el('dd', null, statusBadge(row.status)),
    el('dt', null, '申請日時'), el('dd', null, jst(row.created_at)),
    el('dt', null, '審査日時'), el('dd', null, jst(row.reviewed_at)),
    el('dt', null, '転記生年月日'), el('dd', null, row.birth_date_on_document
      ? row.birth_date_on_document + '（現在 満' + calcAge(row.birth_date_on_document, today) + '歳）'
      : el('span', { class: 'null' }, '未転記')),
    el('dt', null, '転記性別'), el('dd', null, row.gender_on_document ? (GENDER_LABEL[row.gender_on_document] || row.gender_on_document) : el('span', { class: 'null' }, '未転記')),
    el('dt', null, 'OCRヒント'), el('dd', { class: 'dim' }, (row.ocr_gender_hint ? (GENDER_LABEL[row.ocr_gender_hint] || row.ocr_gender_hint) : 'なし') + '（クライアント自己申告。券面は必ず自分の目で確認）'),
    el('dt', null, '顔照合スコア'), el('dd', null, scoreBadge(row.face_match_score)),
    el('dt', null, '審査メモ'), el('dd', null, row.review_note || el('span', { class: 'null' }, 'なし')),
    el('dt', null, '却下理由'), el('dd', null, row.rejection_reason || el('span', { class: 'null' }, 'なし')),
  );
  const userBox = el('div', { style: 'margin-top:10px' },
    el('button', { class: 'btn', onclick: e => loadUserInfo(e.currentTarget, row.user_id) }, '利用者情報・他の申請を取得'));
  const right = el('div', null, facts, userBox);

  // 下段: 監査ログ + SQL生成 + チェックリスト
  const bottom = el('div', { class: 'full' });
  const auditBox = el('div', { class: 'dim', style: 'font-size:12px' }, '監査ログ読込中…');
  bottom.append(auditBox);
  (S.mode === 'admin'
    ? apiJson('/rest/v1/rpc/admin_list_identity_audits?' + rpcQuery({ p_verification_id: row.id }))
    : apiJson('/rest/v1/identity_verification_audits?verification_id=eq.' + encodeURIComponent(row.id) + '&order=changed_at.asc'))
    .then(audits => {
      if (!alive(auditBox)) return;
      auditBox.textContent = '';
      if (!audits.length) { auditBox.append('監査ログ: なし（未審査）'); return; }
      const tbl = el('table', { class: 'grid' },
        el('thead', null, el('tr', null, ['変更日時', '遷移', '実行者', '転記生年月日', '転記性別', '却下理由', '審査メモ'].map(h => el('th', { style: 'position:static' }, h)))),
        el('tbody', null, audits.map(a => el('tr', null,
          el('td', null, jst(a.changed_at)),
          el('td', null, (STATUS_LABEL[a.old_status] || a.old_status) + ' → ' + (STATUS_LABEL[a.new_status] || a.new_status)),
          el('td', null, a.changed_by ? idSpan(a.changed_by) : el('span', { class: 'dim', title: 'Studio・service_role・システムによる直接操作' }, 'Studio/系統')),
          el('td', null, a.birth_date_on_document || '—'),
          el('td', null, a.gender_on_document ? (GENDER_LABEL[a.gender_on_document] || a.gender_on_document) : '—'),
          el('td', null, a.rejection_reason || '—'),
          el('td', null, a.review_note || '—')))));
      auditBox.append(el('div', { class: 'imglabel' }, '監査ログ（identity_verification_audits・改変不可）'), el('div', { class: 'gridwrap' }, tbl));
    })
    .catch(e => { if (alive(auditBox)) auditBox.textContent = '監査ログ取得失敗: ' + e.message; });

  if (row.status === 'pending' || row.status === 'rejected') {
    bottom.append(buildApproveSql(row));
  }
  if (row.status === 'pending' || row.status === 'approved') bottom.append(buildRejectSql(row));
  bottom.append(el('details', { class: 'checklist' },
    el('summary', null, '承認チェックリスト（IDENTITY_REVIEW_OPS.md より）'),
    el('ul', null, CHECKLIST.map(c => el('li', null, c)))));

  d.append(left, right, bottom);
  return d;
}

function loadUserInfo(btn, userId) {
  btn.disabled = true;
  const box = el('div', { style: 'margin-top:8px' }, el('span', { class: 'dim' }, '読込中…'));
  btn.parentElement.append(box);
  // モード差はここで吸収して {auth, authErr, profile, apps} に正規化する
  const load = S.mode === 'admin'
    ? Promise.allSettled([
        apiJson('/rest/v1/rpc/admin_get_review_user?' + rpcQuery({ p_user_id: userId })).then(rows => rows[0] || null),
        apiJson('/rest/v1/rpc/admin_list_identity_verifications?' + rpcQuery({ p_user_id: userId, p_limit: 100 })),
      ]).then(([u, apps]) => ({
        auth: u.status === 'fulfilled' && u.value
          ? { email: u.value.email, created_at: u.value.auth_created_at, last_sign_in_at: u.value.last_sign_in_at, banned_until: u.value.banned_until }
          : null,
        authErr: u.status === 'rejected' ? u.reason.message : 'ユーザーなし',
        profile: u.status === 'fulfilled' && u.value && u.value.profile_role !== null
          ? { display_name: u.value.display_name, role: u.value.profile_role, is_verified: u.value.is_verified, is_female_verified: u.value.is_female_verified }
          : null,
        apps: apps.status === 'fulfilled' ? apps.value : null,
      }))
    : Promise.allSettled([
        apiJson('/auth/v1/admin/users/' + encodeURIComponent(userId)),
        apiJson('/rest/v1/profiles?id=eq.' + encodeURIComponent(userId) + '&select=*'),
        apiJson('/rest/v1/identity_verifications?user_id=eq.' + encodeURIComponent(userId) + '&order=created_at.asc&select=id,status,document_type,created_at,reviewed_at'),
      ]).then(([u, p, apps]) => ({
        auth: u.status === 'fulfilled' ? u.value : null,
        authErr: u.status === 'rejected' ? u.reason.message : '',
        profile: p.status === 'fulfilled' && p.value.length ? p.value[0] : null,
        apps: apps.status === 'fulfilled' ? apps.value : null,
      }));
  load.then(info => {
    if (!alive(box)) return;
    box.textContent = '';
    const dl = el('dl', { class: 'facts' });
    if (info.auth) {
      dl.append(
        el('dt', null, 'メール'), el('dd', null, info.auth.email || el('span', { class: 'null' }, '（匿名認証）')),
        el('dt', null, '登録日時'), el('dd', null, jst(info.auth.created_at)),
        el('dt', null, '最終ログイン'), el('dd', null, jst(info.auth.last_sign_in_at)),
        el('dt', null, 'BAN'), el('dd', null, info.auth.banned_until ? el('span', { class: 'badge bad' }, jst(info.auth.banned_until) + ' まで') : 'なし'));
    } else dl.append(el('dt', null, 'Auth'), el('dd', { class: 'null' }, '取得失敗: ' + (info.authErr || '不明')));
    if (info.profile) {
      dl.append(
        el('dt', null, '表示名'), el('dd', null, info.profile.display_name || '—'),
        el('dt', null, 'ロール'), el('dd', null, String(info.profile.role)),
        el('dt', null, '年齢確認バッジ'), el('dd', null, info.profile.is_verified ? el('span', { class: 'badge good' }, 'is_verified') : 'なし'),
        el('dt', null, '女性確認バッジ'), el('dd', null, info.profile.is_female_verified ? el('span', { class: 'badge good' }, 'is_female_verified') : 'なし'));
    } else dl.append(el('dt', null, 'プロフィール'), el('dd', { class: 'null' }, 'なし'));
    box.append(dl);
    if (info.apps) {
      box.append(el('div', { class: 'imglabel', style: 'margin-top:6px' }, 'この利用者の申請履歴（' + info.apps.length + '件）— 男性判明時は過去の承認行の剥奪漏れに注意'),
        el('ul', { style: 'margin:4px 0;padding-left:18px;font-size:12px' },
          info.apps.map(a => el('li', null,
            jst(a.created_at) + '　' + (DOC_TYPES[a.document_type] || a.document_type) + '　',
            statusBadge(a.status)))));
    }
  });
}

function buildApproveSql(row) {
  const box = el('div', { class: 'sqlbox' });
  box.append(el('h4', null, '承認'),
    el('div', { class: 'dim', style: 'font-size:12px' }, GENDER_RULE[row.document_type] || ''));
  const birth = el('input', { type: 'date' });
  const gender = el('select', null,
    (GENDER_OPTIONS[row.document_type] || ['female', 'notListed']).map(g => el('option', { value: g }, GENDER_LABEL[g])));
  const note = el('input', { type: 'text', placeholder: '審査メモ（任意・利用者から見えない）', style: 'flex:1;min-width:200px', maxlength: '500' });
  const pre = el('pre', null, '');
  const warn = el('div', { class: 'warnline' });
  const execBtn = el('button', { class: 'btn primary' }, '承認を実行');
  const copyBtn = el('button', { class: 'btn' }, 'SQLをコピー（Studio用）');
  const update = () => {
    warn.textContent = '';
    if (!birth.value) { pre.textContent = '-- 書類から読み取った生年月日を入力してください'; execBtn.disabled = copyBtn.disabled = true; return; }
    const age = calcAge(birth.value, jstToday());
    if (age < 20) warn.textContent = '⚠ 本日時点で満' + age + '歳（20歳未満）。この承認はDBトリガーに拒絶されます。';
    else if (age > 100) warn.textContent = '⚠ 本日時点で満' + age + '歳。生年月日の入力ミスでないか確認してください。';
    if (looksLikeMyNumber(note.value)) warn.textContent += ' ⚠ メモに12桁の数字列（個人番号様）が含まれています。DBに拒絶されます。転記禁止。';
    pre.textContent = "select approve_identity_verification('" + row.id + "', date '" + birth.value + "', '" + gender.value + "', '" + sqlEsc(note.value) + "');";
    execBtn.disabled = copyBtn.disabled = false;
  };
  for (const i of [birth, gender, note]) i.addEventListener('input', update);
  copyBtn.addEventListener('click', () => copyText(pre.textContent));
  execBtn.addEventListener('click', async () => {
    const age = calcAge(birth.value, jstToday());
    const msg = 'この申請を承認します。\n\n'
      + '書類: ' + (DOC_TYPES[row.document_type] || row.document_type) + '\n'
      + '生年月日: ' + birth.value + '（本日時点で満' + age + '歳）\n'
      + '転記性別: ' + GENDER_LABEL[gender.value]
      + (note.value ? '\n審査メモ: ' + note.value : '')
      + '\n\nprofiles のバッジが自動更新されます。よろしいですか？';
    if (!confirm(msg)) return;
    execBtn.disabled = true;
    try {
      await callReviewRpc(S.mode === 'admin' ? 'admin_approve_identity_verification' : 'approve_identity_verification',
        { p_id: row.id, p_birth_date: birth.value, p_gender: gender.value, p_note: note.value });
      toast('承認しました（' + (DOC_TYPES[row.document_type] || row.document_type) + ' / ' + GENDER_LABEL[gender.value] + '）');
      S.review.openId = null;
      render();
    } catch (e) {
      toast('承認できませんでした: ' + e.message, true);
      execBtn.disabled = false;
    }
  });
  update();
  box.append(el('div', { class: 'formline' },
    el('span', { class: 'dim' }, '書類上の生年月日:'), birth,
    el('span', { class: 'dim' }, '転記性別:'), gender, note), warn, pre,
    el('div', { class: 'formline' }, execBtn, copyBtn));
  return box;
}

function buildRejectSql(row) {
  const box = el('div', { class: 'sqlbox' });
  box.append(el('h4', null, '却下（理由は利用者に表示・永久保存されます）'));
  const sel = el('select', null,
    el('option', { value: '' }, '定型文を選択…'),
    REJECT_TEMPLATES.map(([label, text]) => el('option', { value: text }, label)));
  const reason = el('textarea', { rows: '2', style: 'width:100%', maxlength: '500', placeholder: '却下理由（必須）。書類上の氏名・住所・番号を絶対に書かない' });
  const pre = el('pre', null, '');
  const warn = el('div', { class: 'warnline' });
  const execBtn = el('button', { class: 'btn primary' }, '却下を実行');
  const copyBtn = el('button', { class: 'btn' }, 'SQLをコピー（Studio用）');
  sel.addEventListener('change', () => { if (sel.value) { reason.value = sel.value; update(); } });
  const update = () => {
    warn.textContent = '';
    if (!reason.value.trim()) { pre.textContent = '-- 却下理由を入力してください（DBが空理由を拒絶します）'; execBtn.disabled = copyBtn.disabled = true; return; }
    if (looksLikeMyNumber(reason.value)) warn.textContent = '⚠ 12桁の数字列(個人番号様)が含まれています。DBに拒絶されます。個人番号は絶対に転記しない。';
    if (reason.value.includes('女性専用サービスのため')) {
      warn.textContent += (warn.textContent ? ' ' : '') +
        '男性判明時の義務（手順6）: 同利用者の過去の承認済み行をすべて剥奪すること（「利用者情報・他の申請を取得」で履歴確認）。アカウント停止・利用制限の判断は運営責任者へエスカレーション。';
    }
    pre.textContent = "select reject_identity_verification('" + row.id + "', '" + sqlEsc(reason.value.trim()) + "');";
    execBtn.disabled = copyBtn.disabled = false;
  };
  reason.addEventListener('input', update);
  copyBtn.addEventListener('click', () => copyText(pre.textContent));
  execBtn.addEventListener('click', async () => {
    const msg = 'この申請を却下します。\n\n'
      + '書類: ' + (DOC_TYPES[row.document_type] || row.document_type) + '\n'
      + '却下理由（利用者に表示・永久保存されます）:\n' + reason.value.trim()
      + (row.status === 'approved' ? '\n\n※ 承認済み行の却下＝バッジ剥奪です。' : '')
      + '\n\nよろしいですか？';
    if (!confirm(msg)) return;
    execBtn.disabled = true;
    try {
      await callReviewRpc(S.mode === 'admin' ? 'admin_reject_identity_verification' : 'reject_identity_verification',
        { p_id: row.id, p_reason: reason.value.trim() });
      toast('却下しました');
      S.review.openId = null;
      render();
    } catch (e) {
      toast('却下できませんでした: ' + e.message, true);
      execBtn.disabled = false;
    }
  });
  update();
  if (row.status === 'approved') box.append(el('div', { class: 'warnline' }, '承認済み行の却下＝バッジ剥奪です。男性判明時は同利用者の他の承認行もすべて剥奪すること（申請履歴で確認）。'));
  box.append(el('div', { class: 'formline' }, sel), reason, warn, pre,
    el('div', { class: 'formline' }, execBtn, copyBtn));
  return box;
}

// ---------- 通報審査 ----------
function reportStatusBadge(st) {
  const cls = { pending: 'warn', reviewing: 'grey', resolved: 'good', dismissed: 'grey', accountSuspended: 'bad' }[st] || 'grey';
  return el('span', { class: 'badge ' + cls }, REPORT_STATUS_LABEL[st] || st);
}
function urgentBadge() {
  return el('span', { class: 'badge bad', title: '緊急トリアージ（priority=1: 詐欺・金銭要求 / 未成年関与）' }, '🚨 緊急');
}

// 一覧＋件数の取得。serviceモードは PostgREST 直、adminモードは管理者RPC（GET）経由。
// 'closed' は終端3種（resolved / dismissed / accountSuspended）のグループ指定。
async function fetchReportsPage() {
  const r = S.reports;
  const stFilter = r.status === 'all' ? null : r.status;
  if (S.mode === 'admin') {
    const cnt = st => apiJson('/rest/v1/rpc/admin_count_reports?' + rpcQuery({ p_status: st }));
    const [pending, reviewing, closed, rows] = await Promise.all([
      cnt('pending'), cnt('reviewing'), cnt('closed'),
      apiJson('/rest/v1/rpc/admin_list_reports?' +
        rpcQuery({ p_status: stFilter, p_limit: r.limit, p_offset: r.offset })),
    ]);
    const counts = { pending, reviewing, closed };
    const total = stFilter ? counts[stFilter] : pending + reviewing + closed;
    return { counts, rows, total };
  }
  const closedQ = 'status=in.(' + REPORT_CLOSED.join(',') + ')';
  const q = stFilter === 'closed' ? '&' + closedQ : (stFilter ? '&status=eq.' + stFilter : '');
  const [pending, reviewing, closed, rowsRes] = await Promise.all([
    countRows('reports', 'status=eq.pending'),
    countRows('reports', 'status=eq.reviewing'),
    countRows('reports', closedQ),
    api('/rest/v1/reports?select=*&order=priority.desc,reported_at.asc,id.asc&limit=' + r.limit +
      '&offset=' + r.offset + q, { headers: { Prefer: 'count=exact' } }),
  ]);
  return { counts: { pending, reviewing, closed }, rows: await rowsRes.json(), total: totalFromRange(rowsRes) };
}

function renderReports() {
  const root = el('div');
  root.append(el('div', { class: 'callout info' },
    el('b', null, '通報審査: '),
    '終端（対応済み・却下・アカウント停止相当）は確定後変更できません。全遷移は report_audits に自動記録されます。'
    + '実際のアカウント停止（BAN）・強制退会は「ペナルティ」タブから実行できます。'));
  root.append(memberIdSearchBar());

  const chips = el('div', { class: 'toolbar' });
  const listBox = el('div', { class: 'card' }, el('div', { class: 'placeholder' }, '読込中…'));
  const pager = el('div', { class: 'pager' });
  root.append(chips, listBox, pager);

  (async () => {
    try {
      const { counts, rows, total } = await fetchReportsPage();
      if (!alive(root)) return;
      // 他所の審査でキューが縮んで offset が総件数を超えたら最終ページへ戻す
      if (!rows.length && total > 0 && S.reports.offset > 0) {
        S.reports.offset = Math.floor((total - 1) / S.reports.limit) * S.reports.limit;
        render();
        return;
      }
      const all = counts.pending + counts.reviewing + counts.closed;

      // ステータスチップ
      chips.textContent = '';
      const defs = [
        ['pending', '審査待ち', counts.pending],
        ['reviewing', '対応中', counts.reviewing],
        ['closed', '終端（対応済み・却下・停止）', counts.closed],
        ['all', 'すべて', all],
      ];
      for (const [st, label, n] of defs) {
        chips.append(el('button', {
          class: 'chip' + (S.reports.status === st ? ' active' : ''),
          onclick: () => { S.reports.status = st; S.reports.offset = 0; S.reports.openId = null; render(); },
        }, label + ' ' + n));
      }
      chips.append(el('button', { class: 'btn', style: 'margin-left:auto', onclick: () => render() }, '再読込'));

      // 一覧
      listBox.textContent = '';
      if (!rows.length) listBox.append(el('div', { class: 'placeholder' }, '該当する通報はありません'));
      for (const row of rows) listBox.append(buildReportRow(row));

      // ページャ
      pager.textContent = '';
      const from = total ? S.reports.offset + 1 : 0;
      const to = S.reports.offset + rows.length;
      pager.append(
        el('button', { class: 'btn', disabled: S.reports.offset === 0 ? '' : null, onclick: () => { S.reports.offset = Math.max(0, S.reports.offset - S.reports.limit); render(); } }, '前へ'),
        el('span', null, from + '–' + to + ' / ' + total + ' 件（緊急優先・通報日時の古い順）'),
        el('button', { class: 'btn', disabled: to >= total ? '' : null, onclick: () => { S.reports.offset += S.reports.limit; render(); } }, '次へ'));
    } catch (e) {
      if (alive(root)) { listBox.textContent = ''; listBox.append(el('div', { class: 'placeholder' }, '読込失敗: ' + e.message)); }
    }
  })();
  return root;
}

function buildReportRow(row) {
  const card = el('div', { class: 'card' });
  const head = el('div', { class: 'rowcard' },
    reportStatusBadge(row.status),
    row.priority === 1 ? urgentBadge() : null,
    el('span', null, REPORT_REASONS[row.reason] || row.reason),
    el('span', { class: 'dim' }, '通報 ' + jst(row.reported_at)),
    el('span', { class: 'dim' }, '被通報者 ', idSpan(row.reported_user_id),
      row.reported_nickname ? '（' + row.reported_nickname + '）' : ''),
  );
  head.addEventListener('click', () => {
    const open = card.querySelector('.detail');
    if (open) { open.remove(); S.reports.openId = null; }
    else { S.reports.openId = row.id; card.append(buildReportDetail(row)); }
  });
  card.append(head);
  if (S.reports.openId === row.id) card.append(buildReportDetail(row));
  return card;
}

    el('dt', null, '被通報者ID'), el('dd', null, idSpan(row.reported_user_id)),

    el('dt', null, '審査日時'), el('dd', null, jst(row.reviewed_at)),
    el('dt', null, '処理メモ'), el('dd', null, row.review_note || el('span', { class: 'null' }, 'なし')),

  const box = el('div', { class: 'sqlbox' });

  const warn = el('div', { class: 'warnline' });
  note.addEventListener('input', () => {
    warn.textContent = looksLikeMyNumber(note.value)

  });
  const btnRow = el('div', { class: 'formline' });

    ['dismissed', '却下で確定', 'btn'],
    ['accountSuspended', 'アカウント停止相当で確定', 'btn'],
  ];
  for (const [st, label, cls] of actions) {
    if (st === 'reviewing' && row.status !== 'pending') continue; // reviewing→reviewing はDBが拒絶

      const noteVal = note.value.trim();
      if (st !== 'reviewing' && !noteVal) { toast('確定には処理メモの入力が必須です', true); note.focus(); return; }
      if (looksLikeMyNumber(noteVal)) { toast('個人番号と誤認しうる12桁の数字列はメモに記入できません', true); return; }
      const msg = 'この通報を「' + REPORT_STATUS_LABEL[st] + '」にします。\n\n'
        + '理由: ' + (REPORT_REASONS[row.reason] || row.reason) + '\n'
        + '被通報者: ' + row.reported_user_id + (row.reported_nickname ? '（' + row.reported_nickname + '）' : '')
        + (noteVal ? '\n処理メモ: ' + noteVal : '')
        + (st === 'accountSuspended' ? '\n\n※ これは記録です。実際のBANは続けて「ペナルティ」タブで実行してください。' : '')
        + (st !== 'reviewing' ? '\n\n※ 確定後はこの通報を変更できません。' : '')

// ---------- テーブル ----------
async function ensureSwagger() {
  if (S.swagger) return;
  S.swagger = await apiJson('/rest/v1/', { headers: { Accept: 'application/openapi+json' } });
  S.tables.list = Object.keys(S.swagger.definitions || {}).sort();
}
function tableColumns(name) {
  const def = (S.swagger.definitions || {})[name];
  return def ? Object.keys(def.properties || {}) : [];
}

// ---------- ペナルティ（通報・被ブロック件数 → 停止/解除/強制退会） ----------
// 20260718000006_moderation_penalties.sql の RPC を使用。
// 自動処分はしない: 候補一覧から運営が1件ずつ確認して手動確定する。
async function fetchPenaltyPage() {
  const p = S.penalty;
  return apiJson('/rest/v1/rpc/admin_list_penalty_candidates?' + rpcQuery({
    p_min_reports: p.minReports, p_min_blocks: p.minBlocks,
    p_limit: p.limit, p_offset: p.offset,
  }));
}

// SQL側（is_account_active / get_my_account_status）と同じ「banned_until > 今」で
// 停止中を判定する。期限切れBAN（自動でnullには戻らない）は稼働中として扱う。
function isBanActive(bannedUntil) {
  return !!bannedUntil && new Date(bannedUntil) > new Date();
}

function penaltyBanBadge(bannedUntil) {
  if (!isBanActive(bannedUntil)) {
    return bannedUntil
      ? el('span', { class: 'badge good' }, '稼働中（停止期限切れ）')
      : el('span', { class: 'badge good' }, '稼働中');
  }
  const until = new Date(bannedUntil);
  const permanent = until.getFullYear() - new Date().getFullYear() > 50;
  return el('span', { class: 'badge bad' },
    permanent ? '無期限停止中' : '停止中（〜' + jst(bannedUntil) + '）');
}

function penaltyAction(row, fn, args, actionLabel, extraWarn) {
  const b = el('button', { class: 'btn' }, actionLabel);
  b.addEventListener('click', async () => {
    const note = prompt(
      '処分メモ（必須・利用者には表示されません）\n'
      + '対象: ' + (row.nickname || '（表示名なし）') + ' / ' + (row.member_id || row.user_id) + '\n'
      + '処分: ' + actionLabel + '\n\n'
      + '根拠となる通報IDや判断理由を記入してください。個人番号・氏名・住所は書かない。');
    if (note === null) return;
    if (!note.trim()) { toast('処分メモは必須です', true); return; }
    const msg = '「' + (row.nickname || row.user_id) + '」に対して『' + actionLabel + '』を実行します。\n'
      + '通報 ' + row.report_total + ' 件 / 被ブロック ' + row.block_count + ' 件\n'
      + (extraWarn ? '\n' + extraWarn + '\n' : '')
      + '\nよろしいですか？';
    if (!confirm(msg)) return;
    b.disabled = true;
    try {
      await callReviewRpc(fn, Object.assign({ p_user_id: row.user_id, p_note: note.trim() }, args));
      toast('『' + actionLabel + '』を実行しました（moderation_audits に記録済み）');
      render();
    } catch (e) {
      toast('実行できませんでした: ' + e.message, true);
      b.disabled = false;
    }
  });
  return b;
}

function buildPenaltyRow(row) {
  const card = el('div', { class: 'card' });
  const head = el('div', { class: 'rowcard' },
    penaltyBanBadge(row.banned_until),
    el('span', null, row.nickname || '（表示名なし）'),
    el('span', { class: 'dim' }, row.member_id || '（利用者ID未発行）'),
    idSpan(row.user_id),
    el('span', { class: 'dim' }, row.role === 'parent' ? '預ける側' : '預かる側'),
    el('span', null, '通報 ' + row.report_total + ' 件'
      + '（未処理 ' + row.report_open + ' / 停止確定 ' + row.report_suspended + '）'),
    el('span', null, '被ブロック ' + row.block_count + ' 件'),
    el('span', { class: 'dim' }, '最終利用 ' + jst(row.last_active_at)),
  );
  const acts = el('div', { class: 'formline', onclick: e => e.stopPropagation() });
  if (isBanActive(row.banned_until)) {
    acts.append(
      penaltyAction(row, 'admin_unban_user', {}, '停止を解除'),
      penaltyAction(row, 'admin_force_delete_user', {}, '強制退会（アカウント削除）',
        '※ 元に戻せません。プロフィール・本人確認データが削除されます（通報等の証跡は残ります）。'));
  } else {
    acts.append(
      penaltyAction(row, 'admin_set_user_ban', { p_days: 7 }, '7日停止'),
      penaltyAction(row, 'admin_set_user_ban', { p_days: 30 }, '30日停止'),
      penaltyAction(row, 'admin_set_user_ban', { p_days: null }, '無期限停止'),
      penaltyAction(row, 'admin_force_delete_user', {}, '強制退会（アカウント削除）',
        '※ 元に戻せません。通常はまず停止し、異議がなければ退会を確定してください。'));
  }
  card.append(head, acts);
  return card;
}

function renderPenalty() {
  const root = el('div');
  root.append(el('div', { class: 'callout info' },
    el('b', null, 'ペナルティ: '),
    '通報された件数・ブロックされた件数が閾値以上のアカウントを表示します。自動処分はされません — '
    + '通報審査で事実を確認したうえで、ここから停止（BAN）・解除・強制退会を手動確定してください。'
    + '停止は即時にクラウド書き込みを遮断し、再ログインも拒否されます。全処分は moderation_audits に記録されます。'));

  const bar = el('div', { class: 'toolbar' });
  const mkNum = (label, key) => {
    const input = el('input', { type: 'number', min: '1', value: String(S.penalty[key]), style: 'width:64px' });
    input.addEventListener('change', () => {
      S.penalty[key] = Math.max(1, parseInt(input.value, 10) || 1);
      S.penalty.offset = 0;
      render();
    });
    return [el('span', { class: 'dim' }, label), input];
  };
  bar.append(...mkNum('通報', 'minReports'), el('span', { class: 'dim' }, '件以上 または'),
    ...mkNum('被ブロック', 'minBlocks'), el('span', { class: 'dim' }, '件以上'),
    el('button', { class: 'btn', style: 'margin-left:auto', onclick: () => render() }, '再読込'));

  const listBox = el('div', { class: 'card' }, el('div', { class: 'placeholder' }, '読込中…'));
  const pager = el('div', { class: 'pager' });
  root.append(bar, listBox, pager);

  (async () => {
    try {
      const rows = await fetchPenaltyPage();
      if (!alive(root)) return;
      listBox.textContent = '';
      if (!rows.length) {
        listBox.append(el('div', { class: 'placeholder' },
          '閾値（通報' + S.penalty.minReports + '件以上 または 被ブロック' + S.penalty.minBlocks + '件以上）に該当するアカウントはありません'));
      }
      for (const row of rows) listBox.append(buildPenaltyRow(row));

      pager.textContent = '';
      const from = rows.length ? S.penalty.offset + 1 : 0;
      const to = S.penalty.offset + rows.length;
      pager.append(
        el('button', { class: 'btn', disabled: S.penalty.offset === 0 ? '' : null,
          onclick: () => { S.penalty.offset = Math.max(0, S.penalty.offset - S.penalty.limit); render(); } }, '前へ'),
        el('span', null, from + '–' + to + ' 件（通報＋被ブロック合計の多い順）'),
        el('button', { class: 'btn', disabled: rows.length < S.penalty.limit ? '' : null,
          onclick: () => { S.penalty.offset += S.penalty.limit; render(); } }, '次へ'));
    } catch (e) {
      if (alive(root)) { listBox.textContent = ''; listBox.append(el('div', { class: 'placeholder' }, '読込失敗: ' + e.message)); }
    }
  })();
  return root;
}

// ---------- 退会（account_deletions の理由・進捗閲覧） ----------
// 20260805000011_account_deletions_admin_list.sql の RPC を使用。閲覧専用。
const DELETION_STATUS_LABEL = {
  deletion_requested: '削除申請受付',
  anonymizing: '匿名化中',
  storage_cleanup_pending: '画像削除待ち',
  storage_cleanup_completed: '画像削除済み',
  oauth_cleanup_pending: 'SNS連携解除待ち',
  oauth_cleanup_completed: 'SNS連携解除済み',
  auth_deletion_pending: '認証削除待ち',
  deleted: '退会完了',
  deletion_failed: '失敗（要確認）',
};
const DELETION_ROLE_LABEL = { parent: '保護者', caregiver: '保育者', 親: '保護者', 介護者: '保育者' };

function fetchDeletions() {
  return apiJson('/rest/v1/rpc/admin_list_account_deletions?' + rpcQuery({
    p_limit: S.deletions.limit, p_offset: S.deletions.offset,
  }));
}

function deletionReasonText(row) {
  return (row.reason && row.reason.trim()) || (row.reason_code && row.reason_code.trim()) || '（理由の記載なし）';
}

function renderDeletions() {
  const root = el('div');
  root.append(el('div', { class: 'callout info' },
    el('b', null, '退会: '),
    '退会（アカウント削除）の記録と理由を新しい順に表示します。閲覧専用です。'
    + '理由は利用者の自由記述を含むため取り扱いに注意してください。'
    + '「失敗（要確認）」の行が残っている場合はサーバーログの確認が必要です。'));

  const listBox = el('div', { class: 'card' }, el('div', { class: 'placeholder' }, '読込中…'));
  const summaryBox = el('div', { class: 'card' });
  const pager = el('div', { class: 'pager' });
  root.append(summaryBox, listBox, pager);

  (async () => {
    try {
      const rows = await fetchDeletions();
      if (!alive(root)) return;

      // 理由別の件数集計（読込済み分。既定200件で通常は全件）
      summaryBox.textContent = '';
      const counts = new Map();
      for (const r of rows) {
        const key = deletionReasonText(r);
        counts.set(key, (counts.get(key) || 0) + 1);
      }
      const sorted = [...counts.entries()].sort((a, b) => b[1] - a[1]);
      summaryBox.append(el('div', null, el('b', null, '理由別の件数'),
        el('span', { class: 'dim' }, '（読込済み ' + rows.length + ' 件の内訳）')));
      for (const [reason, n] of sorted) {
        summaryBox.append(el('div', null,
          el('span', { class: 'badge' }, String(n) + '件'), ' ', reason));
      }
      if (!sorted.length) summaryBox.append(el('div', { class: 'placeholder' }, 'まだ退会の記録はありません'));

      listBox.textContent = '';
      if (!rows.length) {
        listBox.append(el('div', { class: 'placeholder' }, '退会の記録はありません'));
      }
      for (const row of rows) {
        const failed = row.status === 'deletion_failed';
        const done = row.status === 'deleted';
        listBox.append(el('div', { class: 'rowcard', style: 'cursor:default' },
          el('span', { class: 'dim' }, jst(row.created_at)), ' ',
          el('b', null, row.member_id || '（ID未設定）'), ' ',
          el('span', { class: 'badge' }, DELETION_ROLE_LABEL[row.role] || row.role || '役割不明'), ' ',
          el('span', { class: 'badge ' + (failed ? 'bad' : (done ? 'good' : '')) },
            DELETION_STATUS_LABEL[row.status] || row.status), ' ',
          el('span', null, deletionReasonText(row))));
      }

      pager.textContent = '';
      const from = rows.length ? S.deletions.offset + 1 : 0;
      const to = S.deletions.offset + rows.length;
      pager.append(
        el('button', { class: 'btn', disabled: S.deletions.offset === 0 ? '' : null,
          onclick: () => { S.deletions.offset = Math.max(0, S.deletions.offset - S.deletions.limit); render(); } }, '前へ'),
        el('span', null, from + '–' + to + ' 件（新しい順）'),
        el('button', { class: 'btn', disabled: rows.length < S.deletions.limit ? '' : null,
          onclick: () => { S.deletions.offset += S.deletions.limit; render(); } }, '次へ'));
    } catch (e) {
      if (alive(root)) { listBox.textContent = ''; listBox.append(el('div', { class: 'placeholder' }, '読込失敗: ' + e.message)); }
    }
  })();
  return root;
}

const DUP_STATUS_LABEL = {
  pending_review: '審査待ち',
  confirmed_same_person: '同一人物と確定',
  different_person: '別人と確定',
  inconclusive: '判定保留（再審査可）',
};
const DUP_REASON_LABEL = {

  document_number_only: '書類番号のみ一致',
  name_dob_and_document: '氏名+生年月日と書類番号の両方が一致',
  conflicting_keys: 'キー同士が矛盾（別人物に跨がる一致）',
  image_mismatch: '券面画像の目視で別人と判断',
  insufficient_evidence: '判断材料が不足',
};
const DUP_PRIOR_LABEL = {

function renderDup() {

  const backfillBox = el('div', { class: 'card' }, el('div', { class: 'placeholder' }, '転記待ちを読込中…'));

function buildBackfillRow(row) {
  const box = el('div', { class: 'rowcard', style: 'border-bottom:1px solid var(--line);padding:10px 0' });
  const head = el('div', null,
    el('span', { class: 'mono' }, (DOC_TYPES[row.document_type] || row.document_type) + ' '),
    el('span', { class: 'dim mono', style: 'font-size:12px' },
      'user: ' + row.user_id + ' / 承認: ' + String(row.approved_at).slice(0, 16)),
    row.expired_at ? el('span', { style: 'color:var(--bad)' }, ' ⚠ 券面画像の保持期限切れ（転記不能・記録のみ）') : null);
  box.append(head);
  if (row.expired_at) return box;

  const nameIn = el('input', { type: 'text', placeholder: '券面どおりの氏名（姓と名の間の空白は自動で除去）', style: 'width:260px' });
  const numIn = el('input', { type: 'text',
    placeholder: row.document_type === 'myNumberCard'
      ? '（マイナンバーカードは番号入力なし）' : '書類番号（パスポート/免許証。任意だが推奨）',
    style: 'width:260px', disabled: row.document_type === 'myNumberCard' ? '' : null });
  const btn = el('button', { class: 'btn primary' }, '転記して登録');
  btn.addEventListener('click', async () => {
    if (!nameIn.value.trim()) { toast('氏名を入力してください', true); return; }
    btn.disabled = true;
    try {
      const res = await apiJson('/rest/v1/rpc/admin_register_person_keys', {
        method: 'POST',
        body: { p_verification_id: row.verification_id,
                p_name_on_document: nameIn.value,
                p_document_number: numIn.value || null } });
      if (res && res.result === 'flagged') {
        toast('既存の人物との一致を検知しました。下の重複人物フラグから審査してください');
      } else {
        toast('転記・登録が完了しました（' + (res && res.result) + '）');
      }
      render();
    } catch (e) { toast('登録失敗: ' + e.message, true); btn.disabled = false; }
  });
  box.append(el('div', { class: 'toolbar', style: 'margin-top:6px' }, nameIn, numIn, btn),
    el('div', { class: 'dim', style: 'font-size:12px;margin-top:4px' },
      '個人番号（マイナンバー12桁）は法律により入力・利用できません。'
      + '入力した氏名・番号はハッシュ化され、原文はどこにも保存されません。'));
  return box;
}

function buildDupFlagRow(row) {
  const box = el('div', { style: 'border-bottom:1px solid var(--line);padding:10px 0' });
  const matches = Array.isArray(row.matches) ? row.matches : [];
  const matchedPersons = [...new Set(matches.map(m => m.matched_person_id))];
  box.append(el('div', null,
    el('span', { class: 'mono' }, '一致 ' + matches.length + ' キー / 計算 '
      + row.computed_key_count + ' キー '),
    el('span', { class: 'dim mono', style: 'font-size:12px' },
      '新規user: ' + row.new_user_id + ' / 検知: ' + String(row.created_at).slice(0, 16))));
  // 自動一次判定（20260805000001）: 一致キーの種類から確度を提示する。
  // 最終判断は従来どおり運営の確定操作のみ（この表示は参考情報）
  const hasDocNumber = matches.some(m => String(m.key_type).startsWith('document_number'));
  const hasNameDob = matches.some(m => String(m.key_type).startsWith('name_dob'));
  if (hasDocNumber || hasNameDob) {
    box.append(el('div', { style: 'margin:4px 0 0 12px;font-size:13px' },
      el('b', null, '🤖 自動一次判定: '),
      hasDocNumber
        ? el('span', { style: 'color:var(--bad)' }, '同一書類の番号が一致（同一人物の可能性: 高）')
        : el('span', null, '氏名+生年月日が一致（同一人物の可能性: 中。同姓同名・同じ生年月日の別人の可能性も残ります）')));
  }
  for (const m of matches) {
    box.append(el('div', { class: 'dim', style: 'font-size:12px;margin-left:12px' },
      '・' + (m.key_type === 'name_dob:v1' ? '氏名+生年月日' : '書類番号') + ' が一致 → 相手user: '
      + m.matched_user_id + '（' + (DUP_PRIOR_LABEL[m.prior_state] || m.prior_state) + '）'
      + (m.matched_key_alive ? '' : '（相手キーは保持期間経過で削除済み）')));
  }
  // 関係者のペナルティ概況（20260805000001）: 同一人物確定時にブラック
  // リストが自動引き継ぎされること、利用停止（banned_until）は手動判断で
  // あることを運営が把握できるようにする
  const penalties = Array.isArray(row.penalties) ? row.penalties : [];
  const penalized = penalties.filter(p =>
    p.is_blacklisted || p.late_cancel_penalty_count > 0 || p.banned_until || p.has_penalty_history);
  if (row.person_penalized || penalized.length) {
    const pbox = el('div', { style: 'margin:6px 0 0 12px;padding:6px 8px;border:1px solid var(--bad);border-radius:6px;font-size:12px' });
    pbox.append(el('div', null, el('b', { style: 'color:var(--bad)' }, '⚠ ペナルティ記録あり'),
      el('span', { class: 'dim' }, ' — 「同一人物と確定」するとブラックリストは全リンク先へ自動引き継ぎされます。利用停止（BAN）は自動化されないため、必要ならペナルティタブから手動で設定してください')));
    for (const p of penalized) {
      const parts = [];
      if (p.is_blacklisted) parts.push('ブラックリスト中');
      if (p.late_cancel_penalty_count > 0) parts.push('直前キャンセル' + p.late_cancel_penalty_count + '回');
      if (p.banned_until) parts.push('利用停止（〜' + String(p.banned_until).slice(0, 16) + '）');
      if (!parts.length && p.has_penalty_history) parts.push('過去に処分歴あり（現在は解除済み）');
      pbox.append(el('div', { class: 'mono dim' },
        '・user: ' + p.user_id + (p.is_new_user ? '（新規）' : '')
        + (p.profile_alive ? '' : '（退会済み）') + ' — ' + parts.join(' / ')));
    }
    if (row.person_penalized) {
      pbox.append(el('div', { class: 'dim' }, '・この人物は無期限保持対象（persons.penalized_at 設定済み）'));
    }
    box.append(pbox);
  }
  if (row.status !== 'pending_review' && row.status !== 'inconclusive') {
    box.append(el('div', { style: 'margin-top:4px' },
      el('b', null, DUP_STATUS_LABEL[row.status] || row.status),
      el('span', { class: 'dim' }, ' — 根拠: ' + (DUP_REASON_LABEL[row.review_reason_code] || row.review_reason_code)
        + (row.review_note ? ' / 補足: ' + row.review_note : ''))));
    return box;
  }

  const codeSel = el('select', null,
    el('option', { value: 'confirmed_same_person' }, '同一人物と確定（既存の人物へリンク）'),
    el('option', { value: 'different_person' }, '別人と確定（新しい人物として登録）'),
    el('option', { value: 'inconclusive' }, '判定保留（後で再審査）'));
  const reasonSel = el('select', null, Object.entries(DUP_REASON_LABEL).map(([v, label]) =>
    el('option', { value: v }, label)));
  const personSel = matchedPersons.length > 1
    ? el('select', null, matchedPersons.map(p => el('option', { value: p }, 'リンク先: ' + p)))
    : null;
  const noteIn = el('input', { type: 'text', style: 'width:320px',
    placeholder: '補足（任意・例外的な場合のみ）' });
  const btn = el('button', { class: 'btn primary' }, '確定');
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    try {
      const res = await apiJson('/rest/v1/rpc/admin_review_duplicate_flag', {
        method: 'POST',
        body: { p_flag_id: row.id, p_review_code: codeSel.value,
                p_reason_code: reasonSel.value, p_note: noteIn.value || '',
                p_person_id: (codeSel.value === 'confirmed_same_person' && personSel)
                  ? personSel.value : null } });
      const carried = res && res.penalty_carried_count;
      toast('審査を確定しました' + (carried
        ? '（⚠ ブラックリストを' + carried + 'アカウントへ自動引き継ぎしました。'
          + '利用停止が必要ならペナルティタブから手動で設定してください）' : ''));
      render();
    } catch (e) { toast('確定失敗: ' + e.message, true); btn.disabled = false; }
  });
  box.append(el('div', { class: 'toolbar', style: 'margin-top:6px' },
    codeSel, reasonSel, personSel, noteIn, btn),
    el('div', { style: 'font-size:12px;margin-top:4px;color:var(--bad)' },
      '⚠ 補足欄に氏名・住所・書類番号などの個人情報を書かないでください（判定根拠は固定コードで示します。8桁以上の数字列はDB側が拒否します）'));
  return box;
}

function renderTables() {
  const root = el('div', { class: 'layout' });
  const side = el('div', { class: 'side' }, el('div', { class: 'placeholder' }, '読込中…'));
  const main = el('div', null, el('div', { class: 'placeholder card' }, '左の一覧からテーブルを選択'));
  root.append(side, main);
  ensureSwagger().then(() => {
    if (!alive(side)) return;
    side.textContent = '';
    for (const name of S.tables.list) {
      side.append(el('button', {
        class: 'sideitem' + (S.tables.current === name ? ' active' : ''),
        onclick: () => {
          Object.assign(S.tables, { current: name, offset: 0, sortCol: null, sortDir: 'asc', fCol: '', fOp: 'eq', fVal: '' });
          render();
        },
      }, name));
    }
    if (S.tables.current) loadTableRows(main);
  }).catch(e => { if (alive(side)) { side.textContent = ''; side.append(el('div', { class: 'placeholder' }, '取得失敗: ' + e.message)); } });
  return root;
}

function loadTableRows(main) {
  const t = S.tables;
  main.textContent = '';
  main.append(el('div', { class: 'placeholder card' }, t.current + ' を読込中…'));
  const params = ['select=*', 'limit=' + t.limit, 'offset=' + t.offset];
  // order 無しの limit/offset は行の重複・欠落を起こす（Postgres は順序を保証しない）ため必ず order を付ける
  const cols0 = tableColumns(t.current);
  const tiebreak = cols0.includes('id') ? 'id' : cols0[0];
  if (t.sortCol) {
    params.push('order=' + encodeURIComponent(t.sortCol) + '.' + t.sortDir +
      (tiebreak && tiebreak !== t.sortCol ? ',' + encodeURIComponent(tiebreak) + '.asc' : ''));
  } else if (tiebreak) {
    params.push('order=' + encodeURIComponent(tiebreak) + '.asc');
  }
  if (t.fCol && t.fVal !== '') {
    const v = t.fOp === 'ilike' ? '*' + t.fVal + '*' : t.fVal;
    params.push(encodeURIComponent(t.fCol) + '=' + t.fOp + '.' + encodeURIComponent(v));
  } else if (t.fCol && t.fOp === 'is') {
    params.push(encodeURIComponent(t.fCol) + '=is.null');
  }
  api('/rest/v1/' + encodeURIComponent(t.current) + '?' + params.join('&'), { headers: { Prefer: 'count=exact' } })
    .then(async res => {
      const rows = await res.json();
      const total = totalFromRange(res);
      if (!alive(main)) return;
      if (!rows.length && total > 0 && t.offset > 0) {
        t.offset = Math.floor((total - 1) / t.limit) * t.limit;
        loadTableRows(main);
        return;
      }
      main.textContent = '';
      const cols = tableColumns(t.current);
      const shown = rows.length ? Object.keys(rows[0]) : cols;

      // フィルタ行
      const fCol = el('select', null, el('option', { value: '' }, '（フィルタ列）'), cols.map(c => el('option', { value: c, selected: t.fCol === c ? '' : null }, c)));
      const fOp = el('select', null, ['eq', 'neq', 'ilike', 'gt', 'gte', 'lt', 'lte', 'is'].map(o => el('option', { value: o, selected: t.fOp === o ? '' : null }, o === 'is' ? 'is null' : o)));
      const fVal = el('input', { type: 'text', value: t.fVal, placeholder: '値（ilike は部分一致）' });
      const apply = () => { t.fCol = fCol.value; t.fOp = fOp.value; t.fVal = fOp.value === 'is' ? 'null' : fVal.value; t.offset = 0; loadTableRows(main); };
      fVal.addEventListener('keydown', e => { if (e.key === 'Enter') apply(); });
      main.append(el('div', { class: 'toolbar' },
        el('span', { class: 'mono', style: 'font-size:14px' }, t.current),
        el('span', { class: 'dim' }, total + ' 行'),
        fCol, fOp, fVal,
        el('button', { class: 'btn', onclick: apply }, '絞り込む'),
        el('button', { class: 'btn', onclick: () => { t.fCol = ''; t.fVal = ''; t.offset = 0; loadTableRows(main); } }, '解除')));

      // グリッド
      const thead = el('tr', null, shown.map(c => el('th', {
        class: 'sortable',
        title: 'クリックでソート',
        onclick: () => { t.sortDir = (t.sortCol === c && t.sortDir === 'asc') ? 'desc' : 'asc'; t.sortCol = c; loadTableRows(main); },
      }, c + (t.sortCol === c ? (t.sortDir === 'asc' ? ' ▲' : ' ▼') : ''))));
      const tbody = el('tbody', null, rows.map(r => el('tr', null, shown.map(c => el('td', null, cellVal(r[c]))))));
      main.append(el('div', { class: 'gridwrap' }, el('table', { class: 'grid' }, el('thead', null, thead), tbody)));
      if (!rows.length) main.append(el('div', { class: 'placeholder' }, '0 行'));

      // ページャ
      main.append(el('div', { class: 'pager', style: 'margin-top:10px' },
        el('button', { class: 'btn', disabled: t.offset === 0 ? '' : null, onclick: () => { t.offset = Math.max(0, t.offset - t.limit); loadTableRows(main); } }, '前へ'),
        el('span', null, (total ? t.offset + 1 : 0) + '–' + (t.offset + rows.length) + ' / ' + total),
        el('button', { class: 'btn', disabled: t.offset + rows.length >= total ? '' : null, onclick: () => { t.offset += t.limit; loadTableRows(main); } }, '次へ')));
    })
    .catch(e => { if (alive(main)) { main.textContent = ''; main.append(el('div', { class: 'placeholder card' }, '取得失敗: ' + e.message)); } });
}

function cellVal(v) {
  if (v === null || v === undefined) return el('span', { class: 'null' }, 'null');
  if (typeof v === 'boolean') return el('span', { class: v ? '' : 'dim' }, String(v));
  if (typeof v === 'object') v = JSON.stringify(v);
  const s = String(v);
  if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s)) return idSpan(s);
  if (s.length > 120) {
    const span = el('span', { class: 'trunc', title: 'クリックで全文表示' }, s.slice(0, 120) + '…');
    span.addEventListener('click', () => { span.textContent = s; span.classList.remove('trunc'); }, { once: true });
    return span;
  }
  return el('span', null, s);
}

// ---------- ストレージ ----------
function renderStorage() {
  const root = el('div', { class: 'layout' });
  const side = el('div', { class: 'side' }, el('div', { class: 'placeholder' }, '読込中…'));
  const main = el('div', null, el('div', { class: 'placeholder card' }, '左の一覧からバケットを選択'));
  root.append(side, main);
  (S.storage.buckets ? Promise.resolve(S.storage.buckets) : apiJson('/storage/v1/bucket'))
    .then(buckets => {
      S.storage.buckets = buckets;
      if (!alive(side)) return;
      side.textContent = '';
      for (const b of buckets) {
        side.append(el('button', {
          class: 'sideitem' + (S.storage.bucket === b.name ? ' active' : ''),
          onclick: () => { Object.assign(S.storage, { bucket: b.name, prefix: '', offset: 0 }); render(); },
        }, b.name + (b.public ? '（公開）' : '')));
      }
      if (!buckets.length) side.append(el('div', { class: 'placeholder' }, 'バケットなし'));
      if (S.storage.bucket) loadObjects(main);
    })
    .catch(e => { if (alive(side)) { side.textContent = ''; side.append(el('div', { class: 'placeholder' }, '取得失敗: ' + e.message)); } });
  return root;
}

function loadObjects(main) {
  const st = S.storage;
  main.textContent = '';
  main.append(el('div', { class: 'placeholder card' }, '読込中…'));
  apiJson('/storage/v1/object/list/' + encodeURIComponent(st.bucket), {
    method: 'POST',
    body: { prefix: st.prefix, limit: st.limit, offset: st.offset, sortBy: { column: 'name', order: 'asc' } },
  }).then(entries => {
    if (!alive(main)) return;
    main.textContent = '';

    // パンくず
    const crumbs = el('div', { class: 'crumbs toolbar' });
    crumbs.append(el('a', { onclick: () => { st.prefix = ''; st.offset = 0; loadObjects(main); } }, st.bucket));
    let acc = '';
    for (const seg of st.prefix.split('/').filter(Boolean)) {
      acc += seg + '/';
      const target = acc;
      crumbs.append(' / ', el('a', { onclick: () => { st.prefix = target; st.offset = 0; loadObjects(main); } }, seg));
    }
    main.append(crumbs);

    const preview = el('div');
    const tbl = el('table', { class: 'grid' },
      el('thead', null, el('tr', null, ['名前', 'サイズ', 'MIME', '更新日時'].map(h => el('th', null, h)))));
    const tbody = el('tbody');
    for (const ent of entries) {
      const isFolder = ent.id === null || ent.id === undefined;
      const fullPath = st.prefix + ent.name;
      const meta = ent.metadata || {};
      const tr = el('tr', { class: 'clickable' },
        el('td', { class: 'mono' }, (isFolder ? '📁 ' : '') + ent.name),
        el('td', null, isFolder ? '—' : fmtSize(meta.size)),
        el('td', { class: 'dim' }, isFolder ? '' : (meta.mimetype || '')),
        el('td', { class: 'dim' }, isFolder ? '' : jst(ent.updated_at || ent.created_at)));
      tr.addEventListener('click', () => {
        if (isFolder) { st.prefix = fullPath + '/'; st.offset = 0; loadObjects(main); }
        else showObjectPreview(preview, st.bucket, fullPath, meta);
      });
      tbody.append(tr);
    }
    tbl.append(tbody);
    main.append(el('div', { class: 'gridwrap' }, tbl));
    if (!entries.length) main.append(el('div', { class: 'placeholder' }, '空です'));
    main.append(el('div', { class: 'pager', style: 'margin-top:10px' },
      el('button', { class: 'btn', disabled: st.offset === 0 ? '' : null, onclick: () => { st.offset = Math.max(0, st.offset - st.limit); loadObjects(main); } }, '前へ'),
      el('span', null, 'offset ' + st.offset + '（' + entries.length + ' 件表示・最大' + st.limit + '件/頁）'),
      el('button', { class: 'btn', disabled: entries.length < st.limit ? '' : null, onclick: () => { st.offset += st.limit; loadObjects(main); } }, '次へ')));
    main.append(preview);
  }).catch(e => { if (alive(main)) { main.textContent = ''; main.append(el('div', { class: 'placeholder card' }, '取得失敗: ' + e.message)); } });
}

function fmtSize(n) {
  if (n === null || n === undefined) return '—';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(2) + ' MB';
}

function showObjectPreview(box, bucket, path, meta) {
  box.textContent = '';
  const card = el('div', { class: 'card', style: 'margin-top:12px;padding:12px' },
    el('div', { class: 'imgpath mono trunc', title: 'クリックでパスをコピー', onclick: () => copyText(path) }, bucket + '/' + path),
    el('div', { class: 'dim', style: 'font-size:12px' }, fmtSize(meta.size) + '　' + (meta.mimetype || '不明')));
  box.append(card);
  if ((meta.mimetype || '').startsWith('image/')) {
    const holder = el('div', { class: 'imgholder', style: 'margin-top:8px' }, '読込中…');
    card.append(holder);
    fetchObjectUrl(bucket, path).then(u => {
      if (!alive(holder)) return;
      holder.textContent = '';
      holder.append(el('img', { src: u, alt: path, onclick: () => openLightbox(u, bucket + '/' + path) }));
    }).catch(e => { if (alive(holder)) { holder.classList.add('err'); holder.textContent = '取得失敗: ' + e.message; } });
  } else {
    card.append(el('div', { class: 'dim', style: 'margin-top:8px;font-size:12px' }, '画像以外のためプレビューなし（読み取り専用のためダウンロード機能はありません）'));
  }
}

// ---------- ユーザー ----------
function renderUsers() {
  const root = el('div');
  const bar = el('div', { class: 'toolbar' });
  const box = el('div', { class: 'card' }, el('div', { class: 'placeholder' }, '読込中…'));
  root.append(bar, box);
  const u = S.users;
  apiJson('/auth/v1/admin/users?page=' + u.page + '&per_page=' + u.perPage)
    .then(j => {
      if (!alive(root)) return;
      const users = j.users || j || [];
      const filter = el('input', { type: 'text', value: u.filter, placeholder: 'このページ内をメール/IDで絞り込み', style: 'min-width:260px' });
      filter.addEventListener('input', () => { u.filter = filter.value; drawRows(); });
      bar.append(filter,
        el('span', { class: 'pager', style: 'margin-left:auto' },
          el('button', { class: 'btn', disabled: u.page <= 1 ? '' : null, onclick: () => { u.page--; render(); } }, '前へ'),
          el('span', null, u.page + ' ページ目'),
          el('button', { class: 'btn', disabled: users.length < u.perPage ? '' : null, onclick: () => { u.page++; render(); } }, '次へ')));
      const drawRows = () => {
        const q = u.filter.trim().toLowerCase();
        const list = q ? users.filter(x => (x.email || '').toLowerCase().includes(q) || String(x.id).includes(q)) : users;
        box.textContent = '';
        const tbl = el('table', { class: 'grid' },
          el('thead', null, el('tr', null, ['メール', 'ID', '登録日時', '最終ログイン', '認証方式', 'BAN', ''].map(h => el('th', null, h)))),
          el('tbody', null, list.map(x => el('tr', null,
            el('td', null, x.email || el('span', { class: 'null' }, '（匿名）')),
            el('td', null, idSpan(x.id)),
            el('td', { class: 'dim' }, jst(x.created_at)),
            el('td', { class: 'dim' }, jst(x.last_sign_in_at)),
            el('td', { class: 'dim' }, ((x.app_metadata || {}).providers || [(x.app_metadata || {}).provider]).filter(Boolean).join(', ')),
            el('td', null, x.banned_until ? el('span', { class: 'badge bad' }, jst(x.banned_until) + ' まで') : '—'),
            el('td', null, el('button', {
              class: 'btn', style: 'padding:1px 8px;font-size:12px',
              onclick: () => { S.review.userFilter = x.id; S.review.status = 'all'; S.review.offset = 0; S.tab = 'review'; render(); },
            }, '本人確認履歴'))))));
        box.append(el('div', { class: 'gridwrap', style: 'border:none' }, tbl));
        if (!list.length) box.append(el('div', { class: 'placeholder' }, '該当なし'));
      };
      drawRows();
    })
    .catch(e => { if (alive(box)) { box.textContent = ''; box.append(el('div', { class: 'placeholder' }, '取得失敗: ' + e.message)); } });
  return root;
}

// ---------- ライトボックス ----------
const lb = { rot: 0 };
function openLightbox(url, caption) {
  const img = document.getElementById('lbImg');
  lb.rot = 0;
  img.src = url;
  img.className = 'fit';
  img.style.transform = '';
  document.getElementById('lbCap').textContent = caption;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox' || e.target.classList.contains('lbview')) closeLightbox(); });
document.getElementById('lbRotate').addEventListener('click', () => {
  lb.rot = (lb.rot + 90) % 360;
  document.getElementById('lbImg').style.transform = 'rotate(' + lb.rot + 'deg)';
});
document.getElementById('lbFit').addEventListener('click', () => document.getElementById('lbImg').classList.toggle('fit'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

// ---------- ルーティング ----------
function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === S.tab));
  const v = document.getElementById('view');
  v.textContent = '';
  if (!S.key) { v.append(renderConnect()); return; }
  if (S.mode === 'admin' && S.tab !== 'review' && S.tab !== 'reports'
      && S.tab !== 'penalty' && S.tab !== 'dup' && S.tab !== 'deletions') {
    v.append(el('div', { class: 'placeholder card' },
      'このタブは service_role 接続時のみ利用できます（管理者ログインは審査キュー・通報審査・ペナルティ・退会・重複転記専用です）'));
    return;
  }
  if (S.tab === 'review') v.append(renderReview());
  else if (S.tab === 'reports') v.append(renderReports());
  else if (S.tab === 'penalty') v.append(renderPenalty());
  else if (S.tab === 'deletions') v.append(renderDeletions());
  else if (S.tab === 'dup') v.append(renderDup());
  else if (S.tab === 'tables') v.append(renderTables());
  else if (S.tab === 'storage') v.append(renderStorage());
  else if (S.tab === 'users') v.append(renderUsers());
}
document.querySelectorAll('nav button').forEach(b =>
  b.addEventListener('click', () => { S.tab = b.dataset.tab; render(); }));
document.getElementById('disconnBtn').addEventListener('click', disconnect);
document.getElementById('pushToggleBtn').addEventListener('click', () => {
  (S.push.subscribed ? disablePushNotifications() : enablePushNotifications())
    .catch(e => toast(e.message || String(e)));
});

// 起動: sessionStorage に接続情報があれば復元（管理者ログインのみ）。
// service_role モードは永続化しない方針のため、旧仕様で保存された service キーが
// 残っていても復元せず破棄する（全権キーをストレージに留めない）。
try {
  const saved = sessionStorage.getItem(SS_KEY);
  if (saved) {
    const s = JSON.parse(saved);
    if (s.mode === 'admin' && s.key) {
      S.url = s.url; S.key = s.key;
      S.mode = 'admin';
      S.refreshToken = s.refreshToken || '';
      S.persist = true;
    } else {
      sessionStorage.removeItem(SS_KEY);
    }
  }
} catch (e) { /* 壊れた保存値は無視 */ }
// PWA/Push: Service Workerを起動時に登録しておく（Secure Contextのみ）。
// 通知有効化時だけの登録だと、ブラウザ都合で登録が消えた後にPush受信が
// 途絶えたままになるため、毎起動で再登録する（登録済みなら何もしない）。
if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('./admin-push-sw.js').catch(() => {});
}
(async () => {
  if (S.mode === 'admin' && S.key) await refreshPushUiState();
  updateConnUI();
  render();
})();
</script>
